services:
  db:
    image: postgres:16-alpine
    container_name: fraudlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: fraudlens
      POSTGRES_DB: fraudlens
    ports:
      - "5432:5432"
    volumes:
      - fraudlens_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens -d fraudlens"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fraudlens_db_data:
